name: Test

on:
  push:
    branches: ["dev"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:rust-latest@sha256:e98ef827ad2c282c202d172d5dab065760dc536affbd73554c503b334dbaaec8
    steps:
      - uses: https://github.com/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: https://github.com/Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
