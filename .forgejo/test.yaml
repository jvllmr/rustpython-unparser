name: Test

on:
  push:
    branches: ["dev"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: codeberg-small

    steps:
      - uses: https://github.com/actions/checkout@v6
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
